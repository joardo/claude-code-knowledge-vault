name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Vault Integrity & Skill Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml

      - name: Run Vault Link & Placeholder Audit
        run: |
          python3 00_Meta/audit_vault.py

      - name: Test Universal Shell Installer (Dry Run)
        run: |
          bash install.sh --dry-run
          bash install.sh --global --claude --dry-run
          bash install.sh --project --antigravity --dry-run

      - name: Validate Plugin Manifest JSON
        run: |
          python3 -c "import json; data=json.load(open('.claude-plugin/plugin.json')); assert data['name'] == 'claude-platform-master'"
